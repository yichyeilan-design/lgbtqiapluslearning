<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Highway Racer</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #090d16;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 8px;
    }
    #wrap {
      position: relative;
      border: 2px solid #334155;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
    }
    canvas { display: block; background: #1e293b; }
    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(15, 23, 42, 0.85);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }
    .overlay.hidden { display: none; }
    .btn {
      background: #f97316;
      color: #fff;
      border: none;
      padding: 10px 24px;
      font-weight: 800;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
    }
    .btn:hover { background: #fb923c; }
  </style>
</head>
<body>
  <div id="wrap">
    <canvas id="c" width="340" height="460"></canvas>
    <div id="screen" class="overlay">
      <h1 id="title" style="font-size: 28px; font-weight: 800; color: #f97316;">TURBO DRIFT</h1>
      <p id="sub" style="font-size: 13px; color: #94a3b8;">Arrow Keys / A & D to Steer</p>
      <button class="btn" onclick="start()">IGNITION</button>
    </div>
  </div>
  <div style="margin-top: 10px; font-size: 12px; color: #64748b;">
    Steer left & right · Dodge oncoming traffic
  </div>

  <script>
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');

    const car = { x: 155, y: 370, w: 28, h: 48, speed: 5 };
    let obstacles = [];
    let score = 0;
    let best = localStorage.getItem('drift_best') || 0;
    let roadOffset = 0;
    let gameSpeed = 4.5;
    let playing = false;
    let frame = 0;

    const keys = {};
    window.addEventListener('keydown', e => { keys[e.code] = true; });
    window.addEventListener('keyup', e => { keys[e.code] = false; });

    // Touch steer
    canvas.addEventListener('touchmove', e => {
      const rect = canvas.getBoundingClientRect();
      const x = e.touches[0].clientX - rect.left;
      car.x = Math.max(30, Math.min(canvas.width - car.w - 30, x - car.w/2));
    }, {passive: false});

    function start() {
      car.x = 155;
      obstacles = [];
      score = 0;
      gameSpeed = 4.5;
      frame = 0;
      playing = true;
      document.getElementById('screen').classList.add('hidden');
    }

    function update() {
      if (!playing) return;
      frame++;
      roadOffset = (roadOffset + gameSpeed) % 40;

      if (keys['ArrowLeft'] || keys['KeyA']) car.x = Math.max(25, car.x - car.speed);
      if (keys['ArrowRight'] || keys['KeyD']) car.x = Math.min(canvas.width - car.w - 25, car.x + car.speed);

      if (frame % 10 === 0) {
        score++;
        if (score > best) {
          best = score;
          localStorage.setItem('drift_best', best);
        }
      }

      if (frame % 250 === 0 && gameSpeed < 9) gameSpeed += 0.5;

      // Spawn traffic cars
      if (frame % Math.floor(60 + Math.random() * 40) === 0) {
        const lanes = [45, 115, 190, 260];
        const laneX = lanes[Math.floor(Math.random() * lanes.length)];
        const trafficColors = ['#ef4444', '#3b82f6', '#10b981', '#a855f7'];
        obstacles.push({
          x: laneX,
          y: -60,
          w: 28,
          h: 46,
          color: trafficColors[Math.floor(Math.random() * trafficColors.length)],
          speed: gameSpeed * 0.45
        });
      }

      for (let o of obstacles) {
        o.y += gameSpeed;

        // Collision
        if (car.x < o.x + o.w && car.x + car.w > o.x && car.y < o.y + o.h && car.y + car.h > o.y) {
          endGame();
          return;
        }
      }

      obstacles = obstacles.filter(o => o.y < canvas.height + 60);
    }

    function draw() {
      // Road
      ctx.fillStyle = '#1e293b';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Grass curbs
      ctx.fillStyle = '#065f46';
      ctx.fillRect(0, 0, 20, canvas.height);
      ctx.fillRect(canvas.width - 20, 0, 20, canvas.height);

      // Road markings
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(20, 0, 4, canvas.height);
      ctx.fillRect(canvas.width - 24, 0, 4, canvas.height);

      // Dash lines
      ctx.strokeStyle = '#facc15';
      ctx.lineWidth = 3;
      ctx.setLineDash([20, 20]);
      ctx.lineDashOffset = -roadOffset;

      ctx.beginPath();
      ctx.moveTo(105, 0); ctx.lineTo(105, canvas.height);
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(180, 0); ctx.lineTo(180, canvas.height);
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(255, 0); ctx.lineTo(255, canvas.height);
      ctx.stroke();
      ctx.setLineDash([]);

      // Traffic
      for (let o of obstacles) {
        ctx.fillStyle = o.color;
        ctx.fillRect(o.x, o.y, o.w, o.h);
        // Windshield
        ctx.fillStyle = '#0f172a';
        ctx.fillRect(o.x + 4, o.y + 10, o.w - 8, 8);
        ctx.fillRect(o.x + 4, o.y + 30, o.w - 8, 6);
        // Lights
        ctx.fillStyle = '#fef08a';
        ctx.fillRect(o.x + 3, o.y + 2, 4, 3);
        ctx.fillRect(o.x + o.w - 7, o.y + 2, 4, 3);
      }

      // Player car
      ctx.fillStyle = '#f97316';
      ctx.fillRect(car.x, car.y, car.w, car.h);
      // Windshield
      ctx.fillStyle = '#0f172a';
      ctx.fillRect(car.x + 4, car.y + 12, car.w - 8, 10);
      ctx.fillRect(car.x + 4, car.y + 32, car.w - 8, 6);
      // Headlights
      ctx.fillStyle = '#38bdf8';
      ctx.fillRect(car.x + 3, car.y + 2, 5, 4);
      ctx.fillRect(car.x + car.w - 8, car.y + 2, 5, 4);

      // HUD
      ctx.fillStyle = '#f8fafc';
      ctx.font = '700 13px sans-serif';
      ctx.fillText(`SCORE: ${score}`, 30, 25);
      ctx.fillText(`BEST: ${best}`, canvas.width - 90, 25);
    }

    function endGame() {
      playing = false;
      document.getElementById('title').innerText = 'CRASHED!';
      document.getElementById('title').style.color = '#ef4444';
      document.getElementById('sub').innerText = `Score: ${score} · Best: ${best}`;
      document.getElementById('screen').classList.remove('hidden');
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }
    loop();
  </script>
</body>
</html>
