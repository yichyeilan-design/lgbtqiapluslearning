<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Cyber Typer</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #030712;
      color: #f9fafb;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 16px;
    }
    .card {
      width: 100%;
      max-width: 480px;
      background: #0b1329;
      border: 2px solid #1e293b;
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
      text-align: center;
    }
    .hud {
      display: flex;
      justify-content: space-between;
      margin-bottom: 20px;
      font-size: 13px;
      font-weight: 700;
      color: #94a3b8;
    }
    .val { color: #38bdf8; font-size: 18px; }
    .word-display {
      font-size: 38px;
      font-weight: 900;
      letter-spacing: 2px;
      color: #10b981;
      margin: 25px 0;
      text-shadow: 0 0 12px rgba(16, 185, 129, 0.4);
      min-height: 50px;
    }
    input {
      width: 100%;
      background: #030712;
      border: 2px solid #334155;
      color: #fff;
      font-size: 20px;
      padding: 12px;
      border-radius: 8px;
      text-align: center;
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus { border-color: #38bdf8; }
    .btn {
      margin-top: 16px;
      background: #38bdf8;
      color: #082f49;
      border: none;
      padding: 10px 24px;
      font-weight: 800;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
    }
    .btn:hover { background: #7dd3fc; }
  </style>
</head>
<body>
  <div class="card">
    <div class="hud">
      <div>TIME: <span class="val" id="time">30</span>s</div>
      <div>WPM: <span class="val" id="wpm">0</span></div>
      <div>SCORE: <span class="val" id="score">0</span></div>
    </div>

    <div style="font-size: 12px; text-transform: uppercase; letter-spacing: 1.5px; color: #64748b;">Type this word:</div>
    <div class="word-display" id="targetWord">READY</div>

    <input type="text" id="typeInput" placeholder="Press Start to Begin" disabled autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">

    <div style="margin-top: 20px;">
      <button class="btn" id="startBtn" onclick="startGame()">START 30s SPRINT</button>
    </div>
  </div>

  <script>
    const WORDS = [
      "quantum", "cyber", "galaxy", "matrix", "vector", "binary", "terminal", "packet",
      "server", "cipher", "router", "kernel", "arcade", "glitch", "stream", "portal",
      "shield", "plasma", "stealth", "engine", "neuron", "beacon", "crypto", "syntax",
      "bypass", "hyper", "shadow", "launch", "strike", "system", "fusion", "future"
    ];

    let currentWord = "";
    let score = 0;
    let timeLeft = 30;
    let timer = null;
    let isPlaying = false;
    let totalChars = 0;

    const input = document.getElementById('typeInput');
    const wordEl = document.getElementById('targetWord');
    const timeEl = document.getElementById('time');
    const wpmEl = document.getElementById('wpm');
    const scoreEl = document.getElementById('score');
    const startBtn = document.getElementById('startBtn');

    function nextWord() {
      currentWord = WORDS[Math.floor(Math.random() * WORDS.length)];
      wordEl.innerText = currentWord;
      input.value = "";
    }

    function startGame() {
      score = 0;
      timeLeft = 30;
      totalChars = 0;
      isPlaying = true;
      scoreEl.innerText = score;
      timeEl.innerText = timeLeft;
      wpmEl.innerText = 0;
      input.disabled = false;
      input.placeholder = "Type here...";
      startBtn.disabled = true;
      startBtn.style.opacity = '0.5';

      nextWord();
      input.focus();

      clearInterval(timer);
      timer = setInterval(() => {
        timeLeft--;
        timeEl.innerText = timeLeft;
        let elapsedMins = (30 - timeLeft) / 60;
        let wpm = elapsedMins > 0 ? Math.round((totalChars / 5) / elapsedMins) : 0;
        wpmEl.innerText = wpm;

        if (timeLeft <= 0) {
          endGame();
        }
      }, 1000);
    }

    input.addEventListener('input', () => {
      if (!isPlaying) return;
      if (input.value.trim().toLowerCase() === currentWord.toLowerCase()) {
        score++;
        totalChars += currentWord.length + 1;
        scoreEl.innerText = score;
        nextWord();
      }
    });

    function endGame() {
      clearInterval(timer);
      isPlaying = false;
      input.disabled = true;
      startBtn.disabled = false;
      startBtn.style.opacity = '1';
      startBtn.innerText = "PLAY AGAIN";
      let finalWPM = Math.round((totalChars / 5) / 0.5);
      wordEl.innerText = "TIME'S UP!";
      wordEl.style.color = '#ef4444';
      input.placeholder = `Finished! Score: ${score} · WPM: ${finalWPM}`;
    }
  </script>
</body>
</html>
